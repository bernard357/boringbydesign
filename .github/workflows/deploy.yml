name: Deploy VitePress site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Only pages whose frontmatter state is in this allow-list are published.
      MATCHING_STATES: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 scripts/build_posts.py
      # Rendering non-regression gate: build WITHOUT the state filter so the
      # local-only rendering-test page is present, then validate it. A failure
      # surfaces as a job-summary table and an error annotation on the run.
      - name: Validate GFM + Mermaid rendering
        env:
          MATCHING_STATES: ""
        run: |
          npm run build
          if python3 scripts/test_rendering.py | tee rendering-report.txt; then
            {
              echo "### Rendering test passed ✅"
              echo ""
              echo '```'
              cat rendering-report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Rendering test FAILED ❌"
              echo ""
              echo '```'
              cat rendering-report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Rendering regression::GFM/Mermaid rendering check failed — see the job summary."
            exit 1
          fi
      # Production build: the state filter excludes local-only pages from the
      # published artifact.
      - run: npm run build
      - uses: actions/configure-pages@v4
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: documentation/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
