<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Boring steps">
  <!-- Favicon variant: solid filled staircase, no thin strokes, so it stays
       crisp and recognizable at 16px. First step green, ascending steps ink. -->
  <rect width="32" height="32" rx="6" fill="#f7f8fa"/>
  <rect x="4" y="19" width="7" height="9" rx="1" fill="#1f7a45"/>
  <rect x="12.5" y="12" width="7" height="16" rx="1" fill="#1a2733"/>
  <rect x="21" y="5" width="7" height="23" rx="1" fill="#1a2733"/>
</svg>
